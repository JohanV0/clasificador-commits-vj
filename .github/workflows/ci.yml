name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_pass
          POSTGRES_DB: clasificador_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Inicializar base de datos
        run: |
          PGPASSWORD=admin_pass psql -h localhost -U admin -d clasificador_db -f db/init.sql

      - name: Linter con ruff
        run: ruff check app/ tests/

      - name: Correr tests
        env:
          DATABASE_URL: postgresql://admin:admin_pass@localhost:5432/clasificador_db
        run: pytest tests/ -v
